# Black Ops II settings, read by every .command file (Play Online included).
# Change a value, save, and start the game again. All options: top of run-bo2.sh.

# Frame-rate cap (DXMT's Metal frame pacing). Leave it empty to use the
# monitor's refresh rate; a whole fraction of it paces best (e.g. 160 or 106
# at 320 Hz); 0 = no cap.
MAXFPS=

# Fast x87 maths under Rosetta (1 = on). Set 0 only if the game crashes with it.
X87=1

# Raw mouse input (1 = on).
RAW_INPUT=1

# Controller vibration without input delay (1 = patched xinput; 0 = Wine's original).
RUMBLE_FIX=1

# Stick turn-rate acceleration (0 = off: the stick responds at full speed at once).
AIM_ACCEL=0

# Stick deadzone (the game's default is 0.2; raise it if the stick drifts).
STICK_DEADZONE=0.08

# Which x87 accelerator: athei = athei's x87sidecar release (upstream, grew out
# of Lifeisawful's rosettax87); aio = plutonium-mac-aio's reduced build of it.
X87_SIDECAR=aio
